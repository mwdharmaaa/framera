name: Build Framera Android APK

on:
  push:
    branches:
      - main
      - devv
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -f index.html android/app/src/main/assets/www/
          cp -f manifest.json android/app/src/main/assets/www/
          cp -f sw.js android/app/src/main/assets/www/
          cp -rf css android/app/src/main/assets/www/
          cp -rf src android/app/src/main/assets/www/
          cp -rf assets android/app/src/main/assets/www/

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: framera-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
