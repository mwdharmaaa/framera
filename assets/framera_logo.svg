  <path d="M406 128H384V106" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8"/>
  <path d="M106 384H128V406" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8"/>
  <path d="M406 384H384V406" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8"/>

  <!-- Outer Aperture Box -->
