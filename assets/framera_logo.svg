      <stop offset="0%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="146" y1="146" x2="366" y2="366" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
